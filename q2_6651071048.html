<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Định dạng văn bản</title>
</head>
<body>

    <!-- Tiêu đề chính: Căn giữa -->
    <h2 align="center">Định dạng văn bản</h2>

    <!-- Hóa học -->
    <p>
        <b><u>Hóa học:</u></b> 
        <i>Nước:</i> <font color="#FF0000">H<sub>2</sub>O</font> ; 
        <i>Axit Sunfuric:</i> <font color="#FF0000">H<sub>2</sub>SO<sub>4</sub></font>
    </p>

    <!-- Toán học -->
    <p>
        <b><u>Toán học:</u></b> 
        <i>Phương trình bậc 2:</i> <font color="#FF0000">ax<sup>2</sup> + bx + c = 0</font>
    </p>

    <!-- Tin học -->
    <p>
        <b><u>Tin học:</u></b> <i>Vòng lặp For:</i>
    </p>

    <!-- Đoạn code dùng thẻ <pre> để giữ nguyên căn lề, tô nền xám và chữ xanh dương đậm -->
    <pre style="background-color: #CCCCCC; color: #0000CC; font-weight: bold;">
    For i = 0 To 10
        Tong = Tong + 1
    Next
    </pre>

</body>
</html>
